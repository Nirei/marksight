[package]
name = "marksight"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A minimal, theme-native markdown viewer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cinzatech/marksight"
homepage = "https://github.com/cinzatech/marksight"
keywords = ["markdown", "viewer", "gtk", "commonmark", "gfm"]
categories = ["gui", "text-processing"]
readme = "README.md"
exclude = ["/packaging", "/.github", "/fuzz"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"], optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
notify = "8"
async-channel = "2"
# gettext-system: use the C library's own gettext (glibc/musl ship it);
# without it gettext-sys compiles a vendored C gettext, which survives plain
# cargo builds but breaks inside dpkg-buildpackage's flag environment.
gettext-rs = { version = "0.7.1", optional = true, default-features = false, features = [
    "gettext-system",
] }

[features]
default = ["ui"]
ui = ["dep:gtk", "dep:gettext-rs"]

[dev-dependencies]
proptest = "1.11"

[[bin]]
name = "marksight"
required-features = ["ui"]

[[example]]
name = "startup_bench"
required-features = ["ui"]

[lints.rust]
unsafe_code = "forbid"

[package.metadata.deb]
maintainer = "The marksight contributors"
copyright = "2026, The marksight contributors"
license-file = ["LICENSE-MIT"]
extended-description = "marksight renders Markdown documents with native GTK 4 widgets, following the desktop theme automatically. Raw HTML in documents is dropped rather than rendered, and the program has no JavaScript engine, no network access and no unsafe code."
depends = "libgtk-4-1 (>= 4.10)"
section = "utils"
assets = [
  ["target/release/marksight", "usr/bin/", "755"],
  ["data/io.github.cinzatech.marksight.desktop", "usr/share/applications/", "644"],
  ["data/io.github.cinzatech.marksight.metainfo.xml", "usr/share/metainfo/", "644"],
  ["data/icons/hicolor/scalable/apps/io.github.cinzatech.marksight.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["data/marksight.1", "usr/share/man/man1/", "644"],
