name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          NAME="marksight-$VERSION-${{ matrix.target }}"
          STAGE="target/$NAME"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/marksight "$STAGE/"
          cp README.md "$STAGE/"
          cp LICENSE-MIT LICENSE-APACHE "$STAGE/"
          tar -czf "target/$NAME.tar.gz" -C target "$NAME"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/marksight-*.tar.gz

  publish:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
